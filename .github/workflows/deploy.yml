name: deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-grafana:
    name: Deploy Grafana
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Playwright e dependências Python
        run: |
          python -m pip install --upgrade pip uv
          uv sync --no-dev
          uv run playwright install --with-deps chromium

      - name: Obter credenciais temporárias da AWS
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f creds.txt; rm -rf screenshots' EXIT

          uv run python -u .github/workflows/get_aws_access.py

          AWS_ACCESS_KEY_ID=$(awk -F= '/^AWS_ACCESS_KEY_ID=/{print substr($0,index($0,"=")+1); exit}' creds.txt)
          AWS_SECRET_ACCESS_KEY=$(awk -F= '/^AWS_SECRET_ACCESS_KEY=/{print substr($0,index($0,"=")+1); exit}' creds.txt)
          AWS_SESSION_TOKEN=$(awk -F= '/^AWS_SESSION_TOKEN=/{print substr($0,index($0,"=")+1); exit}' creds.txt)

          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_SESSION_TOKEN" ]; then
            echo "Credenciais AWS incompletas"
            exit 1
          fi

          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"

          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
            echo "AWS_DEFAULT_REGION=us-east-1"
          } >> "$GITHUB_ENV"

          rm -f creds.txt
          rm -rf screenshots

      - name: Instalar AWS CLI
        run: |
          python -m pip install --upgrade uv
          uv venv
          uv pip install awscli

      - name: Validar credenciais
        run: |
          aws sts get-caller-identity
          aws ec2 describe-key-pairs --key-names grafana-key --region us-east-1

      - name: Deploy Grafana via CloudFormation
        run: |
          aws cloudformation deploy \
            --template-file infra/grafana.yaml \
            --stack-name fraud-watch-grafana-stack \
            --parameter-overrides KeyName=grafana-key \
            --region us-east-1 \
            --no-fail-on-empty-changeset

      - name: Obter IP público da EC2
        id: get_ip
        run: |
          set -euo pipefail

          IP=$(aws cloudformation describe-stacks \
            --stack-name fraud-watch-grafana-stack \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='InstancePublicIP'].OutputValue" \
            --output text)

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "IP público não encontrado"
            exit 1
          fi

          echo "EC2_IP=$IP" >> "$GITHUB_OUTPUT"

      - name: Restaurar chave PEM
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GRAFANA_KEY }}" > ~/.ssh/grafana.pem
          chmod 600 ~/.ssh/grafana.pem

      - name: Atualizar código e reiniciar Docker
        run: |
          ssh-keyscan -H "${{ steps.get_ip.outputs.EC2_IP }}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/grafana.pem \
              -o StrictHostKeyChecking=yes \
              ec2-user@${{ steps.get_ip.outputs.EC2_IP }} << 'EOF'
            set -e

            if [ ! -d /home/ec2-user/grafana/.git ]; then
              sudo rm -rf /home/ec2-user/grafana
              sudo git clone https://github.com/TCC-Fraud-Watch/grafana.git /home/ec2-user/grafana
              sudo chown -R ec2-user:ec2-user /home/ec2-user/grafana
            fi

            cd /home/ec2-user/grafana
            git config --global --add safe.directory /home/ec2-user/grafana
            sudo git pull origin main
            cd /home/ec2-user/grafana
            sudo docker-compose down || true
            sudo docker-compose up -d --build
          EOF